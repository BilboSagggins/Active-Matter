name: Update news

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-news.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Nothing to commit"
          else
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add data/news.json
            git commit -m "Update news feed"
            git push
          fi
